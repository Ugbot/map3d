<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>map3d — wasm client</title>
    <style>
      :root { color-scheme: dark; }
      html, body {
        margin: 0;
        padding: 0;
        width: 100%;
        height: 100%;
        background: #0a0d12;
        color: #d6dbe2;
        font-family: ui-monospace, SFMono-Regular, Menlo, monospace;
        overflow: hidden;
      }
      #canvas {
        display: block;
        width: 100vw;
        height: 100vh;
        background: #0a0d12;
        outline: none;
      }
      #status {
        position: fixed;
        top: 12px;
        right: 12px;
        padding: 6px 10px;
        background: rgba(15, 20, 28, 0.85);
        border: 1px solid #2a3340;
        border-radius: 6px;
        font-size: 12px;
        line-height: 1;
        letter-spacing: 0.04em;
        text-transform: uppercase;
        display: flex;
        align-items: center;
        gap: 8px;
        z-index: 10;
      }
      #status .dot {
        width: 8px;
        height: 8px;
        border-radius: 50%;
        background: #c46a3f;
        box-shadow: 0 0 6px currentColor;
      }
      #status[data-state="connecting"] .dot { background: #d8a738; }
      #status[data-state="open"]       .dot { background: #4fbd6e; }
      #status[data-state="closed"]     .dot { background: #c46a3f; }
      #status[data-state="error"]      .dot { background: #d24a4a; }
      #origin-panel {
        position: fixed;
        top: 12px;
        left: 12px;
        padding: 10px 12px;
        background: rgba(15, 20, 28, 0.85);
        border: 1px solid #2a3340;
        border-radius: 6px;
        font-size: 12px;
        display: flex;
        flex-direction: column;
        gap: 6px;
        z-index: 10;
        color: #d6dbe2;
      }
      #origin-panel label {
        display: flex;
        gap: 6px;
        align-items: center;
        font-family: ui-monospace, SFMono-Regular, Menlo, monospace;
        text-transform: uppercase;
        letter-spacing: 0.06em;
        font-size: 10px;
        color: #8a98ad;
      }
      #origin-panel input {
        background: #0a0d12;
        border: 1px solid #2a3340;
        color: #d6dbe2;
        padding: 4px 6px;
        border-radius: 4px;
        width: 110px;
        font-family: inherit;
        font-size: 12px;
      }
      #origin-panel input:focus { outline: none; border-color: #4fbd6e; }
      #origin-panel .row { display: flex; gap: 10px; }
      #origin-panel button {
        background: #1b2532;
        border: 1px solid #2a3340;
        color: #d6dbe2;
        padding: 5px 10px;
        border-radius: 4px;
        font-family: inherit;
        font-size: 12px;
        text-transform: uppercase;
        letter-spacing: 0.06em;
        cursor: pointer;
      }
      #origin-panel button:hover { background: #243245; border-color: #4fbd6e; }
      #origin-panel button:active { background: #0a0d12; }
      #origin-panel .presets {
        display: flex;
        flex-wrap: wrap;
        gap: 4px;
        margin-top: 2px;
      }
      #origin-panel .presets button {
        padding: 3px 6px;
        font-size: 10px;
      }
      #stats-panel {
        position: fixed;
        bottom: 12px;
        right: 12px;
        padding: 8px 10px;
        background: rgba(15, 20, 28, 0.85);
        border: 1px solid #2a3340;
        border-radius: 6px;
        font-size: 11px;
        font-family: ui-monospace, SFMono-Regular, Menlo, monospace;
        color: #d6dbe2;
        z-index: 10;
        display: grid;
        grid-template-columns: auto auto;
        gap: 2px 14px;
        min-width: 180px;
      }
      #stats-panel dt {
        text-transform: uppercase;
        letter-spacing: 0.06em;
        color: #8a98ad;
        font-size: 10px;
      }
      #stats-panel dd {
        margin: 0;
        text-align: right;
        font-variant-numeric: tabular-nums;
      }
      #stats-panel dd.warn { color: #d8a738; }
      #stats-panel dd.bad  { color: #d24a4a; }
      #stats-panel dd.good { color: #4fbd6e; }
      #help-panel {
        position: fixed;
        bottom: 12px;
        left: 12px;
        padding: 8px 10px;
        background: rgba(15, 20, 28, 0.7);
        border: 1px solid #2a3340;
        border-radius: 6px;
        font-size: 10px;
        line-height: 1.5;
        font-family: ui-monospace, SFMono-Regular, Menlo, monospace;
        color: #8a98ad;
        z-index: 10;
        pointer-events: none;
      }
      #help-panel kbd {
        background: #1b2532;
        border: 1px solid #2a3340;
        border-radius: 3px;
        padding: 1px 4px;
        color: #d6dbe2;
        font-size: 10px;
      }
    </style>
  </head>
  <body>
    <canvas id="canvas" tabindex="0"></canvas>
    <div id="status" data-state="connecting">
      <span class="dot"></span>
      <span id="status-text">connecting</span>
    </div>
    <form id="origin-panel" autocomplete="off">
      <div class="row">
        <label>lat <input id="origin-lat" type="number" step="0.0001" value="24.4539" /></label>
        <label>lon <input id="origin-lon" type="number" step="0.0001" value="54.3773" /></label>
      </div>
      <div class="row">
        <button type="submit" id="origin-apply">apply</button>
        <span id="origin-info" style="align-self:center;color:#8a98ad">Abu Dhabi</span>
      </div>
      <div class="presets" id="origin-presets">
        <button type="button" data-lat="24.4539" data-lon="54.3773" data-name="Abu Dhabi">Abu Dhabi</button>
        <button type="button" data-lat="51.5074" data-lon="-0.1278" data-name="London">London</button>
        <button type="button" data-lat="40.7580" data-lon="-73.9855" data-name="NYC">NYC</button>
        <button type="button" data-lat="35.6762" data-lon="139.6503" data-name="Tokyo">Tokyo</button>
        <button type="button" data-lat="48.8566" data-lon="2.3522" data-name="Paris">Paris</button>
      </div>
    </form>
    <dl id="stats-panel">
      <dt>fps</dt>      <dd id="stat-fps">—</dd>
      <dt>frames</dt>   <dd id="stat-frames">—</dd>
      <dt>entities</dt> <dd id="stat-entities">—</dd>
      <dt>tiles</dt>    <dd id="stat-tiles">—</dd>
      <dt>buildings</dt><dd id="stat-buildings">—</dd>
      <dt>meshes</dt>   <dd id="stat-meshes">—</dd>
      <dt>lanterns</dt> <dd id="stat-lanterns">—</dd>
      <dt>props</dt>    <dd id="stat-props">—</dd>
      <dt>ws</dt>       <dd id="stat-ws">—</dd>
    </dl>
    <div id="help-panel">
      drag = look · <kbd>W</kbd><kbd>A</kbd><kbd>S</kbd><kbd>D</kbd> move · <kbd>Q</kbd><kbd>E</kbd> up/down · arrows rotate
    </div>
    <script type="module" src="/src/index.ts"></script>
  </body>
</html>

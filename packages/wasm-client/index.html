<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>map3d — wasm client</title>
    <style>
      :root { color-scheme: dark; }
      html, body {
        margin: 0;
        padding: 0;
        width: 100%;
        height: 100%;
        background: #0a0d12;
        color: #d6dbe2;
        font-family: ui-monospace, SFMono-Regular, Menlo, monospace;
        overflow: hidden;
      }
      #canvas {
        display: block;
        width: 100vw;
        height: 100vh;
        background: #0a0d12;
        outline: none;
      }
      #status {
        position: fixed;
        top: 12px;
        right: 12px;
        padding: 6px 10px;
        background: rgba(15, 20, 28, 0.85);
        border: 1px solid #2a3340;
        border-radius: 6px;
        font-size: 12px;
        line-height: 1;
        letter-spacing: 0.04em;
        text-transform: uppercase;
        display: flex;
        align-items: center;
        gap: 8px;
        z-index: 10;
      }
      #status .dot {
        width: 8px;
        height: 8px;
        border-radius: 50%;
        background: #c46a3f;
        box-shadow: 0 0 6px currentColor;
      }
      #status[data-state="connecting"] .dot { background: #d8a738; }
      #status[data-state="open"]       .dot { background: #4fbd6e; }
      #status[data-state="closed"]     .dot { background: #c46a3f; }
      #status[data-state="error"]      .dot { background: #d24a4a; }
    </style>
  </head>
  <body>
    <canvas id="canvas" tabindex="0"></canvas>
    <div id="status" data-state="connecting">
      <span class="dot"></span>
      <span id="status-text">connecting</span>
    </div>
    <script type="module" src="/src/index.ts"></script>
  </body>
</html>
